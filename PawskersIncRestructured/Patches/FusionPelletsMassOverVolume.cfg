// conversion of .1 LqdDeut and .4 LqdHe3 creates mass, but allows for the liquids to be more compact than the pellets. however if this bothers you (like it did to me initially) enable this patch
@PART[FeRCLouvar]:NEEDS[CommunityResourcePack]:FOR[PawskersIncRestructured]
{
	@MODULE[ModuleSystemHeatConverter|ModuleResourceConverter]
	{
		@INPUT_RESOURCE,0
		{
			@Ratio *= 10.0
		}
		@INPUT_RESOURCE,1
		{
			@Ratio *= 10.0
		}
	}
}